{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5 animate-fade-in">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 shadow-hover">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="display-4 mb-2 animate-bounce-low">🔑</div>
                    <h2 class="fw-bold">Вход</h2>
                </div>
                
                <form method="post" id="login-form">
                    {% csrf_token %}
                    <div class="mb-3 animate-input" style="animation-delay: 0.1s;">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">Логин</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-4 animate-input" style="animation-delay: 0.2s;">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">Пароль</label>
                        {{ form.password }}
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-danger btn-lg rounded-pill fw-bold shadow-danger transition-all">
                            Войти
                        </button>
                    </div>
                </form>
                
                <hr class="my-4 opacity-10">
                
                <p class="text-center mb-0 transition-all">
                    Нет аккаунта? 
                    <a href="{% url 'register' %}" class="text-danger text-decoration-none fw-bold link-underline-hover">Регистрация</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.classList.add('form-control', 'form-control-lg', 'rounded-3', 'border-0', 'bg-body-tertiary', 'shadow-none', 'transition-focus');
        });
    });
</script>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes inputSlide {
        from { opacity: 0; transform: translateX(-15px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes bounceLow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .animate-fade-in {
        animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-input {
        opacity: 0;
        animation: inputSlide 0.5s ease-out forwards;
    }

    .animate-bounce-low {
        display: inline-block;
        animation: bounceLow 3s ease-in-out infinite;
    }

    .shadow-hover {
        transition: all 0.3s ease;
    }

    .shadow-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0,0,0,0.1) !important;
    }

    .transition-focus {
        transition: all 0.3s ease;
        border: 1px solid transparent !important;
    }

    .transition-focus:focus {
        background-color: var(--bs-body-bg) !important;
        border-color: rgba(220, 53, 69, 0.3) !important;
        box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.1) !important;
        transform: scale(1.02);
    }

    .shadow-danger {
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
    }

    .shadow-danger:hover {
        transform: scale(1.03);
        box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
    }

    .shadow-danger:active {
        transform: scale(0.97);
    }

    .link-underline-hover:hover {
        position: relative;
        transition: all 0.3s ease;
    }

    .link-underline-hover:hover {
        letter-spacing: 0.5px;
    }

    .transition-all {
        transition: all 0.3s ease;
    }
</style>
{% endblock %}
